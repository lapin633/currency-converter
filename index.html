<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090d17">
  <meta name="description" content="A fast currency converter with ECB reference rates and a broad set of major world currencies.">
  <title>Currency Converter</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/space.css">
</head>
<body>
  <div id="spaceStars" aria-hidden="true"></div>
  <div class="meteor" aria-hidden="true"></div>
  <div class="meteor second" aria-hidden="true"></div>
  <div class="cursor-light" aria-hidden="true"></div>
  <main class="app" aria-label="Currency Converter">
    <section class="converter" aria-label="Currency conversion">
      <div class="toolbar">
        <button class="settings-toggle" id="settingsToggle" type="button" aria-expanded="false" aria-controls="settingsPanel">
          <i data-lucide="settings-2" aria-hidden="true">⚙</i>
          <span id="settingsToggleText">Settings</span>
        </button>

        <div class="language-switch" role="group" aria-label="Language">
          <button class="language-option active" type="button" data-language="en" aria-pressed="true">EN</button>
          <button class="language-option" type="button" data-language="ru" aria-pressed="false">RU</button>
        </div>
      </div>

      <div class="settings-panel" id="settingsPanel" hidden>
        <div class="settings-row">
          <span class="settings-label" id="themeSettingLabel">Theme</span>
          <div class="segmented-control" role="group" aria-labelledby="themeSettingLabel">
            <button class="segment-option" type="button" data-theme="light" aria-pressed="false">Light</button>
            <button class="segment-option" type="button" data-theme="dark" aria-pressed="false">Dark</button>
          </div>
        </div>
      </div>

      <div class="money-card">
        <div class="card-head">
          <div class="select-shell">
            <label class="visually-hidden" for="from">Source currency</label>
            <select id="from" aria-label="Source currency"></select>
          </div>
        </div>
        <div class="value-row">
          <input class="amount" id="amount" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done" maxlength="24" value="100" placeholder="0" aria-label="Amount" aria-describedby="rateLine">
          <span class="currency-suffix" id="fromSymbol" aria-hidden="true">$</span>
        </div>
      </div>

      <div class="swap-row">
        <button class="swap" id="swap" type="button" aria-label="Swap currencies" title="Swap currencies">
          <i data-lucide="arrow-left-right" aria-hidden="true">⇄</i>
        </button>
      </div>

      <div class="money-card output">
        <div class="card-head">
          <div class="select-shell">
            <label class="visually-hidden" for="to">Target currency</label>
            <select id="to" aria-label="Target currency"></select>
          </div>
        </div>
        <div class="value-row">
          <output class="result" id="result" for="amount from to" aria-live="polite">—</output>
          <span class="currency-suffix" id="toSymbol" aria-hidden="true">€</span>
        </div>
      </div>

      <div class="result-actions">
        <div class="rate-line" id="rateLine" aria-live="polite">Loading rate...</div>

        <button class="copy-button" id="copy" type="button" aria-label="Copy result" disabled>
          <i data-lucide="copy" aria-hidden="true">⧉</i>
          <span id="copyText">Copy</span>
        </button>
      </div>

      <div class="status loading" id="status" role="status" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="statusText">Fetching ECB reference rates</span>
        <button class="status-refresh" id="refresh" type="button" aria-label="Refresh rates" title="Refresh rates">
          <i data-lucide="refresh-cw" aria-hidden="true">↻</i>
        </button>
      </div>
    </section>
  </main>

  <script defer src="https://cdn.jsdelivr.net/npm/lucide@1.25.0/dist/umd/lucide.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@tsparticles/slim@4.3.2/tsparticles.slim.bundle.min.js"></script>
  <script defer src="assets/js/converter.js"></script>
</body>
</html>
