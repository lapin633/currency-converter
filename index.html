<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090d17">
  <meta name="description" content="A fast currency converter with reference rates, charts, themes, and a broad set of major world currencies.">
  <title>Currency Converter</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/space.css">
</head>
<body>
  <div id="spaceStars" aria-hidden="true"></div>
  <div class="meteor" aria-hidden="true"></div>
  <div class="meteor second" aria-hidden="true"></div>
  <div class="cursor-light" aria-hidden="true"></div>
  <main class="app" aria-label="Currency Converter">
    <section class="converter" aria-label="Currency conversion">
      <div class="toolbar">
        <button class="settings-toggle" id="settingsToggle" type="button" aria-expanded="false" aria-controls="settingsPanel">
          <i data-lucide="settings-2" aria-hidden="true">⚙</i>
          <span id="settingsToggleText">Settings</span>
        </button>

        <div class="language-switch" role="group" aria-label="Language">
          <button class="language-option active" type="button" data-language="en" aria-pressed="true">EN</button>
          <button class="language-option" type="button" data-language="ru" aria-pressed="false">RU</button>
        </div>
      </div>

      <div class="settings-panel" id="settingsPanel" hidden>
        <div class="settings-row">
          <span class="settings-label" id="themeSettingLabel">Theme</span>
          <div class="segmented-control two-segments" role="group" aria-labelledby="themeSettingLabel">
            <button class="segment-option" type="button" data-theme="light" aria-pressed="false">Light</button>
            <button class="segment-option" type="button" data-theme="dark" aria-pressed="false">Dark</button>
          </div>
        </div>
        <div class="settings-row">
          <span class="settings-label" id="chartTypeSettingLabel">Chart</span>
          <div class="segmented-control two-segments" role="group" aria-labelledby="chartTypeSettingLabel">
            <button class="segment-option" type="button" data-chart-type="line" aria-pressed="false">Line</button>
            <button class="segment-option" type="button" data-chart-type="candles" aria-pressed="true">Candles</button>
          </div>
        </div>
        <div class="settings-row">
          <span class="settings-label" id="chartPeriodSettingLabel">Period</span>
          <div class="segmented-control three-segments chart-period-control" role="group" aria-labelledby="chartPeriodSettingLabel">
            <button class="segment-option" type="button" data-chart-months="3" aria-pressed="false">3M</button>
            <button class="segment-option" type="button" data-chart-months="6" aria-pressed="true">6M</button>
            <button class="segment-option" type="button" data-chart-months="12" aria-pressed="false">12M</button>
          </div>
        </div>
        <button class="settings-page-button" id="chartPageButton" type="button">
          <i data-lucide="line-chart" aria-hidden="true">↗</i>
          <span id="chartPageButtonText">Price chart</span>
        </button>
      </div>

      <div class="page-view converter-page active" id="converterPage">
        <div class="money-card">
          <div class="card-head">
            <div class="select-shell">
              <label class="visually-hidden" for="from">Source currency</label>
              <select id="from" aria-label="Source currency"></select>
            </div>
          </div>
          <div class="value-row">
            <input class="amount" id="amount" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done" maxlength="24" value="100" placeholder="0" aria-label="Amount" aria-describedby="rateLine">
            <span class="currency-suffix" id="fromSymbol" aria-hidden="true">$</span>
          </div>
        </div>

        <div class="swap-row">
          <button class="swap" id="swap" type="button" aria-label="Swap currencies" title="Swap currencies">
            <i data-lucide="arrow-left-right" aria-hidden="true">⇄</i>
          </button>
        </div>

        <div class="money-card output">
          <div class="card-head">
            <div class="select-shell">
              <label class="visually-hidden" for="to">Target currency</label>
              <select id="to" aria-label="Target currency"></select>
            </div>
          </div>
          <div class="value-row">
            <output class="result" id="result" for="amount from to" aria-live="polite">—</output>
            <span class="currency-suffix" id="toSymbol" aria-hidden="true">€</span>
          </div>
        </div>

        <div class="result-actions">
          <div class="rate-line" id="rateLine" aria-live="polite">Loading rate...</div>

          <button class="copy-button" id="copy" type="button" aria-label="Copy result" disabled>
            <i data-lucide="copy" aria-hidden="true">⧉</i>
            <span id="copyText">Copy</span>
          </button>
        </div>

        <div class="status loading" id="status" role="status" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="statusText">Fetching reference rates</span>
          <button class="status-refresh" id="refresh" type="button" aria-label="Refresh rates" title="Refresh rates">
            <i data-lucide="refresh-cw" aria-hidden="true">↻</i>
          </button>
        </div>
      </div>

      <div class="page-view chart-page" id="chartPage" hidden>
        <div class="chart-head">
          <button class="chart-back" id="chartBack" type="button" aria-label="Back to converter">
            <i data-lucide="arrow-left" aria-hidden="true">←</i>
          </button>
          <div class="chart-copy">
            <h2 id="chartTitle">Price chart</h2>
            <p id="chartSubtitle">EUR against selected currency</p>
          </div>
          <div class="select-shell chart-select-shell">
            <label class="visually-hidden" for="chartCurrency">Chart currency</label>
            <select id="chartCurrency" aria-label="Chart currency"></select>
          </div>
        </div>

        <div class="chart-card" aria-live="polite">
          <div class="chart-meta">
            <span id="chartPair">EUR / USD</span>
            <span id="chartRange">6 months</span>
          </div>
          <svg class="price-chart" id="priceChart" viewBox="0 0 520 260" role="img" aria-labelledby="chartTitle chartSubtitle">
            <defs>
              <linearGradient id="chartFill" x1="0" x2="0" y1="0" y2="1">
                <stop offset="0%" stop-color="currentColor" stop-opacity="0.28"></stop>
                <stop offset="100%" stop-color="currentColor" stop-opacity="0"></stop>
              </linearGradient>
            </defs>
            <g class="chart-grid" id="chartGrid"></g>
            <g class="chart-labels" id="chartLabels"></g>
            <g class="chart-candles" id="chartCandles"></g>
            <path class="chart-area" id="chartArea" d=""></path>
            <path class="chart-line" id="chartLine" d=""></path>
            <g class="chart-points" id="chartPoints"></g>
            <g class="chart-hover" id="chartHover" hidden>
              <line id="chartHoverLine" x1="0" x2="0" y1="0" y2="0"></line>
              <circle id="chartHoverPoint" cx="0" cy="0" r="5"></circle>
            </g>
          </svg>
          <div class="chart-tooltip" id="chartTooltip" hidden>
            <strong id="chartTooltipValue">—</strong>
            <span id="chartTooltipDate">—</span>
          </div>
          <div class="chart-empty" id="chartEmpty" hidden>Loading chart...</div>
        </div>

        <div class="chart-stats">
          <div>
            <span id="chartLatestLabel">Latest</span>
            <strong id="chartLatest">—</strong>
          </div>
          <div>
            <span id="chartChangeLabel">Change</span>
            <strong id="chartChange">—</strong>
          </div>
        </div>
        <div class="status chart-status loading" id="chartStatus" role="status" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="chartStatusText">Loading chart...</span>
          <button class="status-refresh" id="chartRefresh" type="button" aria-label="Refresh chart" title="Refresh chart">
            <i data-lucide="refresh-cw" aria-hidden="true">↻</i>
          </button>
        </div>
      </div>
    </section>
  </main>

  <script defer src="https://cdn.jsdelivr.net/npm/lucide@1.25.0/dist/umd/lucide.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@tsparticles/slim@4.3.2/tsparticles.slim.bundle.min.js"></script>
  <script defer src="assets/js/converter.js"></script>
</body>
</html>
